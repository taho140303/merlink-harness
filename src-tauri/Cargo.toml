[package]
name = "merlink-harness"
version = "0.1.0"
description = "Merlink Harness Tauri v2 Modular Monolith Backend"
authors = ["Merlink Harness Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "merlink_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup", "functions", "serde_json", "uuid", "chrono"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
sha2 = "0.10.9"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1.92"
unicode-segmentation = "1.13.3"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "chrono-impl", "serde-json-impl"] }
dashmap = "6.2.1"
# Explicit native backends: keyring has no default features and otherwise uses a mock store.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
regex = "1.13.1"
once_cell = "1.21.4"
futures = "0.3.34"
futures-util = "0.3.34"
url = "2.5.8"
parking_lot = "0.12.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
rand = "0.8.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

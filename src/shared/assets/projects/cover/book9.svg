    <!-- ===== RONG BIỂN ===== -->
    <!-- Rong trái -->
    <rect x="8"  y="90" width="3" height="60" fill="#15803d"/>
    <rect x="11" y="96" width="2" height="54" fill="#16a34a"/>
    <rect x="5"  y="104" width="3" height="46" fill="#166534"/>
    <rect x="13" y="102" width="2" height="48" fill="#22c55e"/>
    <!-- Rong phải -->
    <rect x="104" y="86" width="3" height="64" fill="#15803d"/>
    <rect x="108" y="94" width="2" height="56" fill="#16a34a"/>
    <rect x="100" y="100" width="3" height="50" fill="#166534"/>
    <rect x="111" y="98" width="2" height="52" fill="#22c55e"/>


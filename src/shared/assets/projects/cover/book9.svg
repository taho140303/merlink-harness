    <g fill="#f97316">
      <rect x="20" y="150" width="4" height="10"/>
      <rect x="16" y="146" width="4" height="6"/>
      <rect x="24" y="144" width="4" height="8"/>
      <rect x="18" y="140" width="3" height="6"/>
      <rect x="26" y="138" width="3" height="6"/>

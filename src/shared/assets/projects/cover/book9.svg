    <g fill="#bae6fd" opacity="0.7">
      <rect x="8"  y="6" width="6" height="1"/>
      <rect x="28" y="8" width="8" height="1"/>
      <rect x="48" y="5" width="5" height="1"/>
      <rect x="68" y="9" width="7" height="1"/>
      <rect x="88" y="6" width="6" height="1"/>
      <rect x="106" y="8" width="8" height="1"/>
    </g>

    <!-- ===== BONG BÓNG ===== -->
    <g fill="#bae6fd" opacity="0.5">
      <rect x="14" y="30" width="3" height="3"/>
      <rect x="24" y="44" width="2" height="2"/>
      <rect x="34" y="36" width="4" height="4"/>
      <rect x="46" y="52" width="2" height="2"/>
      <rect x="86" y="34" width="3" height="3"/>
      <rect x="96" y="48" width="4" height="4"/>
      <rect x="106" y="40" width="2" height="2"/>
      <rect x="20" y="62" width="3" height="3"/>
      <rect x="78" y="66" width="2" height="2"/>

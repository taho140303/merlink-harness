    <rect x="0" y="40"  width="120" height="30"  fill="#0e7490"/>
    <rect x="0" y="70"  width="120" height="30"  fill="#155e75"/>
    <rect x="0" y="100" width="120" height="30"  fill="#164e63"/>
    <rect x="0" y="130" width="120" height="30"  fill="#0c2d3f"/>

    <!-- ===== TIA SÁNG MẶT TRỜI XUYÊN NƯỚC ===== -->

      <rect x="95" y="143" width="2" height="4"/>
      <rect x="91" y="149" width="2" height="4"/>
    </g>

    <!-- ===== CÁ HỀ (dolphin) ===== -->
    <!-- Thân -->
    <polygon points="46,58 62,52 76,54 84,60 76,66 62,68 48,64" fill="#0891b2"/>
    <polygon points="46,58 62,52 76,54 84,60 76,66 62,68 48,64" fill="none" stroke="#0c4a6e" stroke-width="1"/>
    <!-- Bụng sáng -->
    <polygon points="50,62 62,58 76,60 74,64 62,66 52,64" fill="#bae6fd"/>
    <!-- Đầu -->
    <rect x="80" y="56" width="6" height="6" fill="#0891b2"/>
    <rect x="84" y="58" width="4" height="2" fill="#0891b2"/>
    <!-- Mắt -->
    <rect x="82" y="58" width="1" height="1" fill="#020617"/>
    <!-- Vây lưng -->
    <polygon points="62,52 66,44 70,52" fill="#0e7490"/>
    <!-- Vây đuôi -->
    <polygon points="46,58 38,52 40,58 38,64" fill="#0e7490"/>
    <!-- Vây ngực -->
    <polygon points="66,64 64,72 70,68" fill="#0e7490"/>
    <!-- Đường cong cơ thể -->
    <rect x="58" y="56" width="14" height="1" fill="#0c4a6e" opacity="0.5"/>

    <!-- ===== ĐÀN CÁ NHỎ ===== -->
    <g fill="#fbbf24">
      <polygon points="16,76 22,74 22,78"/>
      <polygon points="30,84 36,82 36,86"/>
      <polygon points="98,78 104,76 104,80"/>
      <polygon points="84,90 90,88 90,92"/>
    </g>
    <g fill="#fde68a">
      <rect x="18" y="76" width="2" height="2"/>
      <rect x="32" y="84" width="2" height="2"/>
      <rect x="100" y="78" width="2" height="2"/>
      <rect x="86" y="90" width="2" height="2"/>
    </g>

    <!-- ===== CÁ ĐUÔI XANH LỚN ===== -->
    <polygon points="30,110 44,104 56,108 52,118 40,120 30,116" fill="#22d3ee"/>
    <polygon points="30,110 44,104 56,108 52,118 40,120 30,116" fill="none" stroke="#0e7490" stroke-width="1"/>
    <polygon points="30,110 22,104 24,116" fill="#0891b2"/>
    <rect x="50" y="110" width="1" height="1" fill="#020617"/>
    <rect x="38" y="112" width="8" height="1" fill="#0e7490" opacity="0.6"/>
    <!-- Vây -->
    <polygon points="42,106 44,100 46,106" fill="#0891b2"/>
    <polygon points="40,118 38,124 44,120" fill="#0891b2"/>

    <!-- ===== ĐÁY BIỂN ===== -->
    <polygon points="0,160 12,152 26,158 40,150 54,156 68,150 82,156 96,150 110,156 120,150 120,200 0,200" fill="#0c2d3f"/>
    <polygon points="0,170 20,164 40,170 60,164 80,170 100,164 120,170 120,200 0,200" fill="#082030"/>

    <!-- ===== SAO BIỂN ===== -->
    <g fill="#f97316">
      <rect x="52" y="166" width="2" height="2"/>
      <rect x="50" y="168" width="6" height="2"/>
      <rect x="52" y="170" width="2" height="2"/>
      <rect x="48" y="166" width="2" height="2"/>
      <rect x="56" y="166" width="2" height="2"/>
    </g>

    <!-- ===== VỎ SÒ ===== -->
    <g fill="#fda4af">
      <rect x="88" y="172" width="6" height="4"/>
      <rect x="90" y="170" width="2" height="6"/>
      <rect x="88" y="172" width="1" height="1" fill="#f43f5e"/>
      <rect x="93" y="172" width="1" height="1" fill="#f43f5e"/>
    </g>

    <!-- ===== DẢI TIÊU ĐỀ ===== -->
    <rect x="0" y="172" width="120" height="28" fill="#020617" opacity="0.9"/>
    <rect x="0" y="172" width="120" height="2" fill="#38bdf8"/>
    <rect x="0" y="174" width="120" height="1" fill="#0284c7"/>

    <!-- ===== CHỮ TIÊU ĐỀ ===== -->
    <text x="60" y="185" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14"
          fill="#e0f2fe" text-anchor="middle" letter-spacing="3">OCEAN</text>
    <text x="60" y="194" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="5"
          fill="#38bdf8" text-anchor="middle" letter-spacing="2">DEPTHS UNKNOWN</text>

    <!-- ===== KHUNG VIỀN ===== -->
    <rect x="2" y="2" width="116" height="196" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="6" y="6" width="108" height="188" fill="none" stroke="#0c4a6e" stroke-width="1"/>

    <!-- Góc khung trang trí -->
    <g fill="#38bdf8">
      <rect x="2" y="2" width="4" height="4"/>
      <rect x="114" y="2" width="4" height="4"/>
      <rect x="2" y="194" width="4" height="4"/>
      <rect x="114" y="194" width="4" height="4"/>
    </g>

  </g>

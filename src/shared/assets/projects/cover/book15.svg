      <rect x="34" y="116" width="10" height="2"/>
      <rect x="72" y="120" width="20" height="3"/>
      <rect x="76" y="118" width="12" height="2"/>
      <rect x="20" y="126" width="14" height="2"/>
      <rect x="88" y="128" width="16" height="2"/>

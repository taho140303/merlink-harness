    <!-- Thân núi chính -->
    <polygon points="22,140 60,80 98,140" fill="#4a2a5e"/>
    <polygon points="22,140 60,80 60,140" fill="#3a1f4e"/>
    <!-- Sườn núi -->
    <polygon points="60,80 98,140 60,140" fill="#5c3468"/>
    <!-- Đường vân núi -->
    <g fill="#3a1f4e" opacity="0.6">
      <polygon points="48,110 54,108 60,114 66,108 72,112 68,120 52,120"/>
      <polygon points="42,122 48,120 56,126 64,122 72,126 68,132 46,132"/>
      <polygon points="32,134 40,130 48,134 56,132 64,136 60,140 34,140"/>
    </g>

    <!-- Chóp tuyết -->
    <polygon points="60,80 70,96 64,94 60,98 56,94 50,96" fill="#f8f0f4"/>
    <polygon points="60,80 64,88 60,86 56,88" fill="#ffffff"/>

      <rect x="110" y="84" width="4" height="4"/>
      <rect x="114" y="88" width="4" height="4"/>
      <rect x="118" y="84" width="2" height="3"/>
    </g>
    <g fill="#fbcfe8">
      <rect x="105" y="91" width="2" height="2"/>
      <rect x="111" y="85" width="2" height="2"/>
      <rect x="115" y="89" width="2" height="2"/>
    </g>

    <!-- Cánh hoa bay lả tả -->
    <g fill="#fbcfe8" opacity="0.85">
      <rect x="24" y="70" width="2" height="2"/>
      <rect x="14" y="62" width="2" height="2"/>
      <rect x="8"  y="54" width="1" height="2"/>
      <rect x="30" y="80" width="2" height="1"/>
      <rect x="18" y="76" width="2" height="2"/>
      <rect x="92" y="70" width="2" height="2"/>
      <rect x="102" y="62" width="2" height="2"/>
      <rect x="110" y="56" width="1" height="2"/>
      <rect x="86" y="80" width="2" height="1"/>
      <rect x="100" y="76" width="2" height="2"/>
      <rect x="40" y="58" width="1" height="2"/>
      <rect x="76" y="62" width="2" height="1"/>
      <rect x="48" y="48" width="1" height="1"/>
      <rect x="70" y="44" width="1" height="1"/>

    <rect x="6" y="136" width="2" height="8" fill="#2a1a1e"/>
    <polygon points="2,138 7,130 12,138" fill="#1e3a2e"/>
    <polygon points="3,134 7,128 11,134" fill="#2a4a3a"/>
    <rect x="112" y="136" width="2" height="8" fill="#2a1a1e"/>
    <polygon points="108,138 113,130 118,138" fill="#1e3a2e"/>
    <polygon points="109,134 113,128 117,134" fill="#2a4a3a"/>

    <!-- ===== DẢI TIÊU ĐỀ ===== -->
    <rect x="0" y="160" width="120" height="40" fill="#0f0620"/>
    <rect x="0" y="160" width="120" height="2" fill="#dc2626"/>
    <rect x="0" y="162" width="120" height="1" fill="#991b1b"/>

    <!-- Họa tiết sóng Nhật (seigaiha) -->
    <g fill="none" stroke="#4a2a5e" stroke-width="1">
      <path d="M 10,172 a 5,5 0 0 1 10,0"/>
      <path d="M 20,172 a 5,5 0 0 1 10,0"/>
      <path d="M 30,172 a 5,5 0 0 1 10,0"/>
      <path d="M 40,172 a 5,5 0 0 1 10,0"/>
      <path d="M 50,172 a 5,5 0 0 1 10,0"/>
      <path d="M 60,172 a 5,5 0 0 1 10,0"/>
      <path d="M 70,172 a 5,5 0 0 1 10,0"/>
      <path d="M 80,172 a 5,5 0 0 1 10,0"/>
      <path d="M 90,172 a 5,5 0 0 1 10,0"/>
      <path d="M 100,172 a 5,5 0 0 1 10,0"/>
      <path d="M 110,172 a 5,5 0 0 1 10,0"/>
    </g>

    <!-- ===== CHỮ TIÊU ĐỀ ===== -->
    <text x="60" y="170" font-family="'Courier New', monospace" font-weight="700" font-size="5"
          fill="#f9a8d4" text-anchor="middle" letter-spacing="3">JOURNEY TO THE EAST</text>
    <text x="60" y="184" font-family="'Courier New', monospace" font-weight="900" font-size="15"
          fill="#f8f0f4" text-anchor="middle" letter-spacing="2">JAPAN</text>
    <text x="60" y="194" font-family="'Courier New', monospace" font-weight="700" font-size="6"
          fill="#dc2626" text-anchor="middle" letter-spacing="3">MOUNTAIN</text>

    <!-- ===== KHUNG VIỀN ===== -->
    <rect x="2" y="2" width="116" height="196" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="6" y="6" width="108" height="188" fill="none" stroke="#7f1d1d" stroke-width="1"/>

    <!-- Góc khung -->
    <g fill="#f9a8d4">
      <rect x="2" y="2" width="4" height="4"/>
      <rect x="114" y="2" width="4" height="4"/>
      <rect x="2" y="194" width="4" height="4"/>
      <rect x="114" y="194" width="4" height="4"/>
    </g>

  </g>
</svg>
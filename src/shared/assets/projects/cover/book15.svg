    <rect x="26" y="120" width="68" height="3" fill="#dc2626"/>
    <rect x="26" y="120" width="68" height="1" fill="#991b1b"/>
    <!-- Xà dọc giữa (gakuzuka) -->
    <rect x="58" y="112" width="4" height="8" fill="#dc2626"/>
    <rect x="58" y="112" width="1" height="8" fill="#991b1b"/>

    <!-- Đèn lồng giấy treo -->
    <rect x="34" y="114" width="4" height="4" fill="#fde68a"/>
    <rect x="34" y="114" width="4" height="1" fill="#f59e0b"/>
    <rect x="34" y="117" width="4" height="1" fill="#f59e0b"/>
    <rect x="82" y="114" width="4" height="4" fill="#fde68a"/>
    <rect x="82" y="114" width="4" height="1" fill="#f59e0b"/>
    <rect x="82" y="117" width="4" height="1" fill="#f59e0b"/>


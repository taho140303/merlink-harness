<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="480" height="800" shape-rendering="crispEdges">
  <g>

    <!-- ===== BẦU TRỜI NHẬT ===== -->
    <rect width="120" height="200" fill="#1a0f2e"/>
    <rect x="0" y="0"   width="120" height="30"  fill="#2d1b4e"/>
    <rect x="0" y="30"  width="120" height="25"  fill="#4a2a5e"/>
    <rect x="0" y="55"  width="120" height="25"  fill="#6b3a5e"/>
    <rect x="0" y="80"  width="120" height="30"  fill="#a85570"/>
    <rect x="0" y="110" width="120" height="30"  fill="#d17a8e"/>

    <!-- ===== MẶT TRỜI ĐỎ ===== -->
    <circle cx="60" cy="55" r="30" fill="#dc2626" opacity="0.15"/>
    <circle cx="60" cy="55" r="22" fill="#ef4444" opacity="0.25"/>
    <circle cx="60" cy="55" r="15" fill="#dc2626"/>
    <circle cx="60" cy="55" r="15" fill="none" stroke="#991b1b" stroke-width="1"/>
    <circle cx="60" cy="55" r="11" fill="#ef4444"/>
    <circle cx="60" cy="55" r="11" fill="none" stroke="#b91c1c" stroke-width="1"/>
    <circle cx="57" cy="52" r="3" fill="#f87171" opacity="0.6"/>

    <!-- ===== MÂY SONG SONG (kiểu Nhật) ===== -->
    <g fill="#f0a8b8" opacity="0.5">
      <rect x="6"  y="34" width="26" height="2"/>
      <rect x="10" y="38" width="18" height="2"/>
      <rect x="88" y="30" width="28" height="2"/>
      <rect x="92" y="34" width="20" height="2"/>
      <rect x="0"  y="44" width="18" height="2"/>
      <rect x="102" y="42" width="18" height="2"/>
    </g>
    <g fill="#f8c8d4" opacity="0.4">
      <rect x="14" y="30" width="12" height="1"/>
      <rect x="96" y="26" width="14" height="1"/>
    </g>

    <!-- ===== CHIM BAY ===== -->
    <g fill="#1a0f2e">
      <polygon points="20,46 24,42 26,46 22,48"/>
      <polygon points="30,42 34,38 36,42 32,44"/>
      <polygon points="86,50 90,46 92,50 88,52"/>
      <polygon points="96,44 100,40 102,44 98,46"/>
    </g>


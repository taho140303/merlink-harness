    <rect x="28" y="112" width="4" height="30" fill="#dc2626"/>
    <rect x="28" y="112" width="1" height="30" fill="#991b1b"/>
    <!-- Cột phải -->
    <rect x="88" y="112" width="4" height="30" fill="#dc2626"/>
    <rect x="91" y="112" width="1" height="30" fill="#991b1b"/>
    <!-- Xà ngang trên (kasagi) -->
    <rect x="22" y="108" width="76" height="4" fill="#dc2626"/>
    <rect x="22" y="108" width="76" height="1" fill="#991b1b"/>
    <rect x="22" y="111" width="76" height="1" fill="#7f1d1d"/>

    <rect x="4" y="88" width="2" height="8" fill="#4a2a3e"/>
    <rect x="10" y="92" width="2" height="6" fill="#4a2a3e"/>
    <rect x="14" y="88" width="2" height="6" fill="#4a2a3e"/>

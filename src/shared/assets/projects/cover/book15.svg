      <rect x="12" y="90" width="4" height="4"/>
      <rect x="16" y="86" width="3" height="3"/>
    </g>
    <g fill="#fbcfe8">
      <rect x="3"  y="93" width="2" height="2"/>
      <rect x="9"  y="87" width="2" height="2"/>
      <rect x="13" y="91" width="2" height="2"/>
    </g>

    <!-- Cành phải -->
    <rect x="102" y="92" width="18" height="2" fill="#4a2a3e"/>
    <rect x="106" y="86" width="2" height="8" fill="#4a2a3e"/>
    <rect x="112" y="90" width="2" height="6" fill="#4a2a3e"/>
    <rect x="116" y="86" width="2" height="6" fill="#4a2a3e"/>

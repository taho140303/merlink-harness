    <!-- Cánh trái -->
    <polygon points="54,54 38,16 44,26 40,32 52,42 50,50" fill="#08031a"/>
    <!-- Cánh phải -->
    <polygon points="64,54 80,14 74,24 80,30 68,42 68,48" fill="#08031a"/>
    <!-- Đuôi -->
    <polygon points="26,64 30,58 34,56 48,58 48,64 32,66" fill="#08031a"/>
    <polygon points="26,64 22,60 28,58" fill="#08031a"/>
    <!-- Thân -->
    <rect x="46" y="54" width="26" height="10" fill="#08031a"/>
    <!-- Ngực -->
    <rect x="68" y="48" width="8" height="10" fill="#08031a"/>
    <!-- Cổ -->
    <rect x="72" y="40" width="6" height="12" fill="#08031a"/>
    <!-- Đầu -->
    <rect x="74" y="34" width="12" height="8" fill="#08031a"/>
    <!-- Mõm -->
    <rect x="84" y="36" width="8" height="5" fill="#08031a"/>
    <!-- Hàm dưới -->
    <rect x="82" y="40" width="8" height="2" fill="#08031a"/>
    <!-- Sừng -->
    <polygon points="78,34 76,28 82,34" fill="#08031a"/>
    <polygon points="82,34 83,30 86,34" fill="#08031a"/>
    <!-- Mắt -->
    <rect x="82" y="38" width="2" height="2" fill="#ffcc00"/>
    <rect x="82" y="38" width="2" height="2" fill="#ffaa00" opacity="0.6"/>
    <!-- Chân trước -->
    <rect x="52" y="64" width="3" height="8" fill="#08031a"/>
    <rect x="62" y="64" width="3" height="8" fill="#08031a"/>
    <!-- Móng -->
    <rect x="51" y="70" width="2" height="2" fill="#08031a"/>
    <rect x="54" y="70" width="2" height="2" fill="#08031a"/>
    <rect x="61" y="70" width="2" height="2" fill="#08031a"/>
    <rect x="64" y="70" width="2" height="2" fill="#08031a"/>

    <!-- Lửa từ miệng rồng -->
    <rect x="92" y="38" width="3" height="2" fill="#ff4400"/>
    <rect x="95" y="37" width="3" height="3" fill="#ff8800"/>
    <rect x="98" y="38" width="2" height="2" fill="#ffcc00"/>

    <!-- Tàn lửa (embers) -->
    <g fill="#ff8800" opacity="0.8">
      <rect x="100" y="42" width="1" height="1"/>
      <rect x="104" y="36" width="1" height="1"/>
      <rect x="96" y="46" width="1" height="1"/>
      <rect x="108" y="44" width="1" height="1"/>
    </g>
    <g fill="#ffcc00" opacity="0.6">
      <rect x="102" y="40" width="1" height="1"/>
      <rect x="98" y="50" width="1" height="1"/>

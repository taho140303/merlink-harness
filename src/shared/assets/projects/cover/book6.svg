      <rect x="26" y="74"  width="2" height="2"/>
      <rect x="40" y="80"  width="2" height="2"/>
      <rect x="54" y="72"  width="2" height="2"/>
      <rect x="16" y="90"  width="2" height="2"/>
      <rect x="6"  y="108" width="2" height="2"/>
      <rect x="30" y="100" width="2" height="2"/>
      <rect x="44" y="112" width="2" height="2"/>
      <rect x="68" y="26"  width="2" height="2"/>

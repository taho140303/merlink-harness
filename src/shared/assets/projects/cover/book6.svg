      <rect x="38" y="14"  width="1" height="1"/>
      <rect x="52" y="28"  width="1" height="1"/>
      <rect x="12" y="52"  width="1" height="1"/>
      <rect x="36" y="56"  width="1" height="1"/>
      <rect x="50" y="86"  width="1" height="1"/>
      <rect x="22" y="96"  width="1" height="1"/>
      <rect x="104" y="62" width="1" height="1"/>
      <rect x="112" y="92" width="1" height="1"/>

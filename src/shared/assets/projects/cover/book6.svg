    <!-- ===== MẶT TRĂNG (glow + thân) ===== -->
    <circle cx="98" cy="24" r="14" fill="#e8c872" opacity="0.12"/>
    <circle cx="98" cy="24" r="10" fill="#e8c872" opacity="0.22"/>
    <circle cx="98" cy="24" r="8"  fill="#f5e9b8"/>
    <rect x="95" y="22" width="3" height="3" fill="#d8c98a"/>
    <rect x="100" y="27" width="2" height="2" fill="#d8c98a"/>


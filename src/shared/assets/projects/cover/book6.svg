    <!-- ===== HIỆP SĨ (silhouette) ===== -->
    <!-- Áo choàng -->
    <polygon points="58,132 54,150 60,150 60,132" fill="#1a0a14"/>
    <!-- Chân -->
    <rect x="60" y="144" width="3" height="10" fill="#050110"/>
    <rect x="64" y="144" width="3" height="10" fill="#050110"/>
    <!-- Bàn chân -->
    <rect x="58" y="152" width="5" height="2" fill="#050110"/>
    <rect x="64" y="152" width="5" height="2" fill="#050110"/>
    <!-- Thân -->
    <rect x="59" y="134" width="8" height="10" fill="#050110"/>
    <!-- Đầu / mũ -->
    <rect x="61" y="128" width="5" height="6" fill="#050110"/>
    <polygon points="61,128 63,124 66,128" fill="#050110"/>
    <!-- Lông mũ -->
    <rect x="62" y="120" width="2" height="4" fill="#c0392b"/>
    <rect x="62" y="118" width="1" height="2" fill="#e74c3c"/>
    <!-- Khiên trái -->
    <rect x="56" y="136" width="3" height="8" fill="#0a0820"/>
    <rect x="56" y="138" width="3" height="1" fill="#c9a227"/>
    <!-- Tay cầm kiếm -->
    <rect x="66" y="134" width="3" height="4" fill="#050110"/>
    <rect x="66" y="132" width="7" height="2" fill="#050110"/>
    <!-- Chuôi kiếm -->
    <rect x="71" y="132" width="6" height="2" fill="#a0822a"/>
    <!-- Lưỡi kiếm -->
    <rect x="73" y="116" width="2" height="16" fill="#d4e4f0"/>
    <rect x="73" y="116" width="1" height="16" fill="#ffffff"/>
    <!-- Mũi kiếm -->
    <polygon points="73,114 75,116 73,116" fill="#d4e4f0"/>

    <!-- ===== DẢI TIÊU ĐỀ ===== -->
    <rect x="0" y="162" width="120" height="38" fill="#08051a"/>
    <rect x="0" y="162" width="120" height="2" fill="#c9a227"/>
    <rect x="0" y="164" width="120" height="1" fill="#7a5c1a"/>

    <!-- Họa tiết trang trí tiêu đề -->
    <rect x="18" y="188" width="6" height="1" fill="#c9a227"/>
    <rect x="96" y="188" width="6" height="1" fill="#c9a227"/>

    <!-- ===== CHỮ TIÊU ĐỀ ===== -->
    <text x="60" y="178" font-family="'Courier New', monospace" font-weight="900" font-size="15"
          fill="#f5e9b8" text-anchor="middle" letter-spacing="1">DRAGON</text>
    <text x="60" y="190" font-family="'Courier New', monospace" font-weight="700" font-size="8"
          fill="#c9a227" text-anchor="middle" letter-spacing="2">&amp; KNIGHT</text>
    <text x="60" y="197" font-family="'Courier New', monospace" font-weight="700" font-size="4"
          fill="#7a5c1a" text-anchor="middle" letter-spacing="2">BOOK ONE</text>

    <!-- ===== KHUNG VIỀN ===== -->
    <rect x="2" y="2" width="116" height="196" fill="none" stroke="#c9a227" stroke-width="2"/>
    <rect x="6" y="6" width="108" height="188" fill="none" stroke="#7a5c1a" stroke-width="1"/>

    <!-- Góc khung trang trí -->
    <g fill="#c9a227">
      <rect x="2" y="2" width="4" height="4"/>
      <rect x="114" y="2" width="4" height="4"/>
      <rect x="2" y="194" width="4" height="4"/>
      <rect x="114" y="194" width="4" height="4"/>
    </g>

  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 160" width="384" height="640"
     shape-rendering="crispEdges" style="image-rendering:pixelated">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#05000f"/>
      <stop offset="0.40" stop-color="#14002e"/>
      <stop offset="0.62" stop-color="#33065c"/>
      <stop offset="0.70" stop-color="#5a0a7a"/>
    </linearGradient>

    <clipPath id="sunClip"><rect x="16" y="56" width="64" height="44"/></clipPath>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.22"/>
    </pattern>

    <!-- Pixel font "CYBER" (3x5, scale 2) -->
    <g id="title">
      <!-- C -->
      <rect x="29" y="14" width="6" height="2"/>
      <rect x="29" y="16" width="2" height="2"/>
      <rect x="29" y="18" width="2" height="2"/>
      <rect x="29" y="20" width="2" height="2"/>
      <rect x="29" y="22" width="6" height="2"/>
      <!-- Y -->
      <rect x="37" y="14" width="2" height="2"/><rect x="41" y="14" width="2" height="2"/>
      <rect x="37" y="16" width="2" height="2"/><rect x="41" y="16" width="2" height="2"/>
      <rect x="39" y="18" width="2" height="2"/>
      <rect x="39" y="20" width="2" height="2"/>
      <rect x="39" y="22" width="2" height="2"/>
      <!-- B -->
      <rect x="45" y="14" width="4" height="2"/>
      <rect x="45" y="16" width="2" height="2"/><rect x="49" y="16" width="2" height="2"/>
      <rect x="45" y="18" width="4" height="2"/>
      <rect x="45" y="20" width="2" height="2"/><rect x="49" y="20" width="2" height="2"/>
      <rect x="45" y="22" width="4" height="2"/>
      <!-- E -->
      <rect x="53" y="14" width="6" height="2"/>
      <rect x="53" y="16" width="2" height="2"/>
      <rect x="53" y="18" width="4" height="2"/>
      <rect x="53" y="20" width="2" height="2"/>
      <rect x="53" y="22" width="6" height="2"/>
      <!-- R -->
      <rect x="61" y="14" width="4" height="2"/>
      <rect x="61" y="16" width="2" height="2"/><rect x="65" y="16" width="2" height="2"/>
      <rect x="61" y="18" width="4" height="2"/>
      <rect x="61" y="20" width="2" height="2"/><rect x="65" y="20" width="2" height="2"/>
      <rect x="61" y="22" width="2" height="2"/><rect x="65" y="22" width="2" height="2"/>
    </g>
  </defs>

  <!-- Nền -->
  <rect width="96" height="160" fill="#05000f"/>
  <rect width="96" height="102" fill="url(#sky)"/>

  <!-- Sao -->
  <g fill="#7df9ff" opacity="0.9">
    <rect x="12" y="6"  width="1" height="1"/>
    <rect x="60" y="5"  width="1" height="1"/>
    <rect x="80" y="10" width="1" height="1"/>
    <rect x="22" y="34" width="1" height="1"/>
    <rect x="72" y="30" width="1" height="1"/>
    <rect x="88" y="44" width="1" height="1"/>
    <rect x="6"  y="50" width="1" height="1"/>
    <rect x="90" y="62" width="1" height="1"/>
  </g>

  <!-- Sun synthwave -->
  <g clip-path="url(#sunClip)">
    <rect x="36" y="56" width="24" height="6"  fill="#fff200"/>
    <rect x="28" y="62" width="40" height="6"  fill="#ffb400"/>
    <rect x="24" y="68" width="48" height="8"  fill="#ff5e00"/>
    <rect x="22" y="76" width="52" height="8"  fill="#ff0a78"/>
    <rect x="20" y="84" width="56" height="16" fill="#c500b8"/>
    <!-- vạch cắt -->
    <rect x="16" y="64" width="64" height="2" fill="#1c0338"/>
    <rect x="16" y="72" width="64" height="2" fill="#1c0338"/>
    <rect x="16" y="80" width="64" height="2" fill="#1c0338"/>
    <rect x="16" y="88" width="64" height="3" fill="#1c0338"/>
    <rect x="16" y="94" width="64" height="2" fill="#1c0338"/>
  </g>

  <!-- Đường chân trời -->
  <rect x="0" y="98" width="96" height="4" fill="#00f5ff" opacity="0.15"/>
  <rect x="0" y="100" width="96" height="2" fill="#00f5ff"/>
  <rect x="0" y="102" width="96" height="1" fill="#ff006e" opacity="0.7"/>

  <!-- Lưới phối cảnh -->
  <g stroke="#ff2bd6" stroke-width="1" opacity="0.85" fill="none">
    <line x1="48" y1="102" x2="-12" y2="160"/>
    <line x1="48" y1="102" x2="0"   y2="160"/>
    <line x1="48" y1="102" x2="12"  y2="160"/>
    <line x1="48" y1="102" x2="24"  y2="160"/>
    <line x1="48" y1="102" x2="36"  y2="160"/>
    <line x1="48" y1="102" x2="48"  y2="160"/>
    <line x1="48" y1="102" x2="60"  y2="160"/>
    <line x1="48" y1="102" x2="72"  y2="160"/>
    <line x1="48" y1="102" x2="84"  y2="160"/>
    <line x1="48" y1="102" x2="96"  y2="160"/>
    <line x1="48" y1="102" x2="108" y2="160"/>
  </g>
  <g stroke="#00f5ff" stroke-width="1" opacity="0.45">
    <line x1="0" y1="104" x2="96" y2="104"/>
    <line x1="0" y1="108" x2="96" y2="108"/>
    <line x1="0" y1="113" x2="96" y2="113"/>
    <line x1="0" y1="119" x2="96" y2="119"/>
    <line x1="0" y1="126" x2="96" y2="126"/>
    <line x1="0" y1="134" x2="96" y2="134"/>
    <line x1="0" y1="143" x2="96" y2="143"/>
    <line x1="0" y1="153" x2="96" y2="153"/>
  </g>

  <!-- Circuit trang trí hai bên -->
  <g stroke="#b026ff" stroke-width="1" fill="none" opacity="0.7">
    <path d="M4 60 h6 v6 h4"/>
    <path d="M92 70 h-6 v8 h-4"/>
    <path d="M4 118 h5 v-5"/>
  </g>

  <!-- Tiêu đề glitch -->
  <use href="#title" x="1"  y="0" fill="#ff006e" opacity="0.75"/>
  <use href="#title" x="-1" y="0" fill="#00f5ff" opacity="0.75"/>
  <use href="#title" fill="#eafaff"/>

  <!-- Thanh phụ đề + glitch bar -->
  <rect x="30" y="28" width="36" height="1" fill="#00f5ff" opacity="0.9"/>
  <rect x="34" y="31" width="28" height="1" fill="#ff006e" opacity="0.9"/>
  <rect x="20" y="36" width="40" height="2" fill="#ff006e" opacity="0.55"/>
  <rect x="40" y="40" width="46" height="1" fill="#00f5ff" opacity="0.5"/>

  <!-- Barcode góc dưới -->
  <g fill="#00f5ff" opacity="0.75">
    <rect x="6"  y="150" width="1" height="5"/>
    <rect x="8"  y="150" width="2" height="5"/>
    <rect x="11" y="150" width="1" height="5"/>
    <rect x="13" y="150" width="3" height="5"/>
    <rect x="17" y="150" width="1" height="5"/>
    <rect x="19" y="150" width="2" height="5"/>
    <rect x="22" y="150" width="1" height="5"/>
  </g>
  <g fill="#ff006e" opacity="0.85">
    <rect x="70" y="151" width="20" height="1"/>
    <rect x="74" y="153" width="16" height="1"/>
    <rect x="78" y="155" width="12" height="1"/>
  </g>

  <!-- Khung neon -->
  <g fill="#ff006e">
    <rect x="0"  y="0"   width="96" height="2"/>
    <rect x="0"  y="158" width="96" height="2"/>
    <rect x="0"  y="0"   width="2"  height="160"/>
    <rect x="94" y="0"   width="2"  height="160"/>
  </g>
  <g fill="#00f5ff" opacity="0.65">
    <rect x="3"  y="3"   width="90" height="1"/>
    <rect x="3"  y="156" width="90" height="1"/>
    <rect x="3"  y="3"   width="1"  height="154"/>
    <rect x="92" y="3"   width="1"  height="154"/>
  </g>

  <!-- Scanlines CRT -->
  <rect width="96" height="160" fill="url(#scan)"/>
</svg>
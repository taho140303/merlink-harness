<svg xmlns="http://www.w3.org/2000/svg" viewBox="-280 -250 560 520" width="100%" height="100%">
  <defs>
    <!-- Ghost Body Gradients (3D Clay + Bounce Light) -->
    <radialGradient id="ghostBase" cx="35%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f7f9ff" />
      <stop offset="72%" stop-color="#e5ecff" />
      <stop offset="90%" stop-color="#e2d9ff" />
      <stop offset="100%" stop-color="#ffdbf5" />
    </radialGradient>
    <radialGradient id="cyanBounce" cx="48%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#5ce1ff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#7faaff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7faaff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkBounce" cx="80%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#ff7be5" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#d28fff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d28fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="visorBase" cx="50%" cy="42%" r="58%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#192142" />
      <stop offset="55%" stop-color="#0e1329" />
      <stop offset="88%" stop-color="#090c1c" />
      <stop offset="100%" stop-color="#1d2b66" />
    </radialGradient>
    <radialGradient id="visorTopHighlight" cx="32%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#6e85ff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#3c4fa3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0e1329" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="visorRim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8fa8ff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#141a38" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#48c6ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#9beeff" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="eyeGradLeft" x1="0%" y1="60%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#22f7ff" />
      <stop offset="28%" stop-color="#5ec2ff" />
      <stop offset="65%" stop-color="#9e7bff" />
      <stop offset="92%" stop-color="#ff73e0" />
      <stop offset="100%" stop-color="#ffd1f7" />
    </linearGradient>
    <linearGradient id="eyeGradRight" x1="0%" y1="65%" x2="100%" y2="35%">
      <stop offset="0%" stop-color="#24f9ff" />
      <stop offset="30%" stop-color="#5ac8ff" />
      <stop offset="62%" stop-color="#a27dff" />
      <stop offset="88%" stop-color="#ff7ee2" />
      <stop offset="100%" stop-color="#ffe8ec" />
    </linearGradient>
    <linearGradient id="starGrad" x1="5%" y1="35%" x2="95%" y2="65%">
      <stop offset="0%" stop-color="#1df2ff" />
      <stop offset="25%" stop-color="#399eff" />
      <stop offset="52%" stop-color="#7c6bff" />
      <stop offset="78%" stop-color="#e37eff" />
      <stop offset="95%" stop-color="#ff9ec7" />
      <stop offset="100%" stop-color="#fff0d9" />
    </linearGradient>
    
    <filter id="ghostShadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="-8" dy="24" stdDeviation="18" flood-color="#9aa7e6" flood-opacity="0.48" />
      <feDropShadow dx="16" dy="14" stdDeviation="22" flood-color="#d79eff" flood-opacity="0.38" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.95" />
    </filter>
    <filter id="eyeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="star3D" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-4" dy="10" stdDeviation="10" flood-color="#9a6bff" flood-opacity="0.45" />
      <feDropShadow dx="8" dy="8" stdDeviation="14" flood-color="#ff7be5" flood-opacity="0.4" />
    </filter>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="tinyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <!-- Main Wrapper (No outer box, raw floating character) -->
  <g>
    <!-- 1. Ghost Character -->
    <g transform="translate(-8, 12) rotate(-7)">
      <!-- Ghost Base Shape -->
      <path d="M 0 -195 C 145 -195, 250 -95, 250 38 C 250 112, 208 168, 152 192 C 118 208, 72 222, 34 202 C 12 190, -2 190, -18 202 C -46 220, -96 210, -124 185 C -142 168, -152 146, -154 128 C -178 135, -208 124, -228 98 C -256 62, -258 -12, -222 -78 C -182 -152, -98 -195, 0 -195 Z" fill="url(#ghostBase)" filter="url(#ghostShadow)" />
      <path d="M 0 -195 C 145 -195, 250 -95, 250 38 C 250 112, 208 168, 152 192 C 118 208, 72 222, 34 202 C 12 190, -2 190, -18 202 C -46 220, -96 210, -124 185 C -142 168, -152 146, -154 128 C -178 135, -208 124, -228 98 C -256 62, -258 -12, -222 -78 C -182 -152, -98 -195, 0 -195 Z" fill="url(#cyanBounce)" />
      <path d="M 0 -195 C 145 -195, 250 -95, 250 38 C 250 112, 208 168, 152 192 C 118 208, 72 222, 34 202 C 12 190, -2 190, -18 202 C -46 220, -96 210, -124 185 C -142 168, -152 146, -154 128 C -178 135, -208 124, -228 98 C -256 62, -258 -12, -222 -78 C -182 -152, -98 -195, 0 -195 Z" fill="url(#pinkBounce)" />
      <path d="M -5 -186 C 128 -186, 232 -92, 236 28" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#tinyBlur)" />
      <path d="M -154 128 C -148 108, -138 98, -126 92" fill="none" stroke="#cad6ff" stroke-width="6" stroke-linecap="round" opacity="0.55" filter="url(#tinyBlur)" />
      <path d="M -8 196 C -5 178, 2 168, 10 162" fill="none" stroke="#cad6ff" stroke-width="6" stroke-linecap="round" opacity="0.5" filter="url(#tinyBlur)" />
      
      <!-- Visor -->
      <ellipse cx="4" cy="-6" rx="196" ry="132" fill="#4ad7ff" opacity="0.22" filter="url(#softBlur)" />
      <ellipse cx="2" cy="-10" rx="192" ry="128" fill="url(#visorBase)" stroke="url(#visorRim)" stroke-width="5" />
      <ellipse cx="-25" cy="-35" rx="160" ry="95" fill="url(#visorTopHighlight)" />
      <path d="M -145 -68 C -95 -118, 15 -132, 105 -102" fill="none" stroke="#8ea6ff" stroke-width="8" stroke-linecap="round" opacity="0.35" filter="url(#tinyBlur)" />
      <path d="M -125 82 C -45 122, 65 122, 145 75" fill="none" stroke="#4ce2ff" stroke-width="5" stroke-linecap="round" opacity="0.45" filter="url(#tinyBlur)" />
      
      <!-- Eyes -->
      <g filter="url(#eyeGlow)">
        <path d="M -138 -6 C -112 -46, -54 -46, -32 -4" fill="none" stroke="url(#eyeGradLeft)" stroke-width="26" stroke-linecap="round" />
      </g>
      <path d="M -132 -12 C -110 -42, -58 -42, -38 -10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75" filter="url(#tinyBlur)" />
      <g filter="url(#eyeGlow)">
        <path d="M 42 -2 C 66 -42, 124 -42, 148 0" fill="none" stroke="url(#eyeGradRight)" stroke-width="26" stroke-linecap="round" />
      </g>
      <path d="M 48 -8 C 70 -38, 120 -38, 142 -6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75" filter="url(#tinyBlur)" />
    </g>

    <!-- 2. Floating 3D Sparkle Star -->
    <g transform="translate(196, -168) rotate(11)" filter="url(#star3D)">
      <path d="M 0 -54 C 4 -54, 10 -20, 17 -13 C 24 -6, 56 -4, 56 0 C 56 4, 24 6, 17 13 C 10 20, 4 54, 0 54 C -4 54, -10 20, -17 13 C -24 6, -56 4, -56 0 C -56 -4, -24 -6, -17 -13 C -10 -20, -4 -54, 0 -54 Z" fill="url(#starGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
      <path d="M -38 0 C -15 -3, -3 -15, 0 -38 C 3 -15, 15 -3, 38 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65" filter="url(#tinyBlur)" />
    </g>
  </g>
</svg>
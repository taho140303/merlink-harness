<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <link rel="stylesheet" href="shared.css" />
  <style>
    .projects-page {

      .project-filters { gap: 8px; margin: 16px 0 23px; }
      .project-filter-label { width: 100%; }
      .project-grid { grid-template-columns: 1fr; gap: 15px; }
      .project-cover { aspect-ratio: 16 / 8.3; }
      .project-card { max-width: 530px; width: 100%; margin: 0 auto; }
      .project-card-body { padding: 14px 8px 4px; }
      .project-overlay { display: block; overflow-y: auto; }
      .project-detail-left, .project-detail-right { overflow: visible; }
      .project-detail-left { padding: 17px 20px 25px; border-right: 0; border-bottom: 1px solid var(--project-rule); }
      .project-detail-right { padding: 20px 20px 66px; }
      .project-detail-cover { margin-top: 15px; aspect-ratio: 16 / 8.5; }
      .project-detail-cover .project-cover-caption { font-size: 19px; }
      .project-detail-left h2 { font-size: 31px; }
      .project-detail-eyebrow { margin-top: 23px; }
      .project-detail-facts { margin-top: 19px; padding-top: 16px; }
      .project-detail-actions { justify-content: flex-start; gap: 7px; }
      .project-chapters-head { margin-top: 25px; }
      .project-chapter-trigger { padding: 15px 13px; gap: 10px; }
      .project-chapter-content { padding: 0 15px 22px 53px; }
      .project-chapter-content p { font-size: 14px; }
      .project-toast { left: 17px; right: 17px; bottom: 17px; }
      .project-form { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) { .project-sort-label { display: none; } .project-meta { font-size: 10px; } .project-action { font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { .project-card, .project-toast, .project-overlay, .project-chapter-content { animation: none; } .project-card, .project-filter, .project-cover::before, .project-create-btn { transition: none; } }
  </style>
  <script src="shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const { Shell, Icon, ThemeToggle, Dialog } = window.Merlink;
    const numberFormat = new Intl.NumberFormat('en-US');
    const fallbackCovers = [
      'linear-gradient(135deg, #8d829f, #dbc7b8 56%, #333d6f)',
      'linear-gradient(145deg, #183e65, #5ca6a3 56%, #d4ad7c)',
      'linear-gradient(135deg, #97647d, #d7a1a6 55%, #394562)',
      'linear-gradient(135deg, #343f70, #888ac1 56%, #d9b5a8)',
      'linear-gradient(135deg, #526774, #b4bbb3 52%, #bea486)',
      'linear-gradient(135deg, #435970, #88a4ad 54%, #efbd95)'
    ];
    const motifSuggestions = ['Found family', 'Memory', 'Mystery', 'Identity', 'The sea', 'Second chances', 'Time', 'Belonging'];
    const initialProjects = Array.isArray(window.Merlink.mock?.projects) ? window.Merlink.mock.projects : [];
    const filterGenres = ['Fantasy', 'Sci-fi', 'Romance', 'Mystery', 'Horror'];
    const allGenres = [...filterGenres, 'Magical realism', 'Literary Fiction', 'Contemporary', 'Young adult', 'Historical Fiction', 'Thriller', 'Adventure'];
    const initialForm = { title: '', genre: '', motifs: [], description: '', cover: '' };

    function formatDate(input) {
      if (!input) return 'Recently';
      const date = new Date(input);
      return Number.isNaN(date.getTime()) ? String(input) : new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(date);
    }
    function matchesGenre(projectGenre, filter) {
      if (filter === 'All stories') return true;
      const value = (projectGenre || '').toLowerCase();
      if (filter === 'Sci-fi') return /sci.?fi|science fiction/.test(value);
      if (filter === 'Fantasy') return /fantasy|magical realism/.test(value);
      if (filter === 'Romance') return /romance|romantic/.test(value);
      if (filter === 'Mystery') return /mystery|crime|thriller/.test(value);
      return value.includes(filter.toLowerCase());
    }
    function getCover(project, index) { return project?.cover || fallbackCovers[index % fallbackCovers.length]; }
    function projectIdFromHash(projects) {
      let id;
      try { id = decodeURIComponent(window.location.hash.slice(1)); } catch (_) { return null; }
      return projects.some(project => String(project.id) === id) ? id : null;
    }
    function statusClass(status) { return /draft/i.test(status || '') ? 'is-draft' : /paused|archived/i.test(status || '') ? 'is-paused' : ''; }
    function chapterStatus(status) { return /draft/i.test(status || '') ? 'Drafted' : /written|published|complete/i.test(status || '') ? 'Published' : (status || 'Drafted'); }
    function getWordCount(project) { return Number(project.wordCount) || (project.chapters || []).reduce((total, chapter) => total + (Number(chapter.wordCount) || 0), 0); }
    function ProjectCover({ project, index, detail = false }) {
      return <div className={'project-cover ' + (detail ? 'project-detail-cover' : '')} style={{ background: getCover(project, index), backgroundSize: 'cover', backgroundPosition: 'center' }} role="img" aria-label={'Cover artwork for ' + project.title}>
        <span className="project-cover-label">MERLINK · STORY FILE</span>
        <span className="project-cover-caption">{detail ? project.title : project.genre}</span>
        <span className="project-cover-index">{String(index + 1).padStart(2, '0')}</span>
      </div>;
    }
    function ProjectCard({ project, index, onOpen }) {
      const chapters = project.chapters || [];
      return <article className="project-card surface" role="button" tabIndex={0} aria-label={'View details for ' + project.title} onClick={() => onOpen(project.id)} onKeyDown={event => { if (event.target === event.currentTarget && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); onOpen(project.id); } }}>
        <ProjectCover project={project} index={index} />
        <div className="project-card-body">
          <div className="project-card-title-row">
            <h2 className="project-card-title">{project.title}</h2>
            <span className={'project-status ' + statusClass(project.status)}>{project.status || 'Draft'}</span>
          </div>
          <p className="project-card-genre">{project.genre || 'Uncategorized'} · {numberFormat.format(getWordCount(project))} words</p>
          <div className="project-tags" aria-label="Genre and story motifs">
            <span className="project-tag surface-soft">{project.genre || 'Story'}</span>
            {(project.motifs || []).slice(0, 2).map((motif, i) => <span className="project-tag surface-soft" key={motif + i}>{motif}</span>)}
          </div>
          <div className="project-meta"><span><Icon name="BookOpen" size={13} /> {chapters.length} {chapters.length === 1 ? 'chapter' : 'chapters'}</span><span><Icon name="Clock3" size={13} /> {formatDate(project.updatedAt)}</span></div>
          <button type="button" className="project-view surface-soft" onClick={event => { event.stopPropagation(); onOpen(project.id); }} aria-label={'View details for ' + project.title}>View Details <Icon name="ArrowUpRight" size={14} /></button>
        </div>
      </article>;
    }
    function ProjectDetail({ project, index, onClose, onEdit, onDelete, onExport, blocked = false }) {
      const chapters = project.chapters || [];
      const [openChapter, setOpenChapter] = useState(chapters[0]?.id ?? 0);
      const backRef = useRef(null);
      useEffect(() => {
        const oldOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        backRef.current?.focus();
        return () => { document.body.style.overflow = oldOverflow; };
      }, []);
      useEffect(() => {
        function onKeyDown(event) { if (event.key === 'Escape' && !blocked) onClose(); }
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [onClose, blocked]);
      return <section className="project-overlay" role="dialog" aria-modal={blocked ? undefined : 'true'} aria-hidden={blocked ? 'true' : undefined} inert={blocked ? '' : undefined} aria-label={'Story details: ' + project.title}>
        <div className="project-detail-left">
          <button ref={backRef} className="project-back" type="button" onClick={onClose}><Icon name="ArrowLeft" size={17} /> Back to projects</button>
          <ProjectCover project={project} index={index} detail />
          <p className="project-detail-eyebrow">{project.genre || 'Story project'} · {project.status || 'Draft'}</p>
          <h2>{project.title}</h2>
          <p className="project-description">{project.description || 'A story taking shape, one chapter at a time. Every draft is a new place to begin.'}</p>
          <div className="project-detail-tags">{(project.motifs || []).map((motif, i) => <span className="project-tag surface-soft" key={motif + i}>{motif}</span>)}</div>
          <div className="project-detail-facts" aria-label="Project information">
            <div><span>Author</span><strong>{project.author || 'Your writing studio'}</strong></div>
            <div><span>Created</span><strong>{formatDate(project.createdAt || project.updatedAt)}</strong></div>
            <div><span>Status</span><strong>{project.status || 'Draft'}</strong></div>
            <div><span>Word count</span><strong>{numberFormat.format(getWordCount(project))} words</strong></div>
          </div>
          <div className="project-detail-stats">
            <div><strong>{String(chapters.length).padStart(2, '0')}</strong><span>Chapters</span></div>
            <div><strong>{numberFormat.format(getWordCount(project))}</strong><span>Words written</span></div>
            <div><strong>{formatDate(project.updatedAt)}</strong><span>Last updated</span></div>
          </div>
        </div>
        <div className="project-detail-right">
          <div className="project-detail-actions" aria-label="Project actions">
            <button className="project-action surface-soft" type="button" onClick={onEdit}><Icon name="Pencil" size={14} /> Edit</button>
            <button className="project-action surface-soft is-danger" type="button" onClick={onDelete}><Icon name="Trash2" size={14} /> Delete</button>
            <button className="project-action is-prominent" type="button" onClick={onExport}><Icon name="Download" size={14} /> Export</button>
          </div>
          <div className="project-chapters-head">
            <span className="project-kicker">Inside the manuscript</span>
            <h3>Chapter collection</h3>
            <p>Follow the story from its first line. Select a chapter to read the draft.</p>
          </div>
          <div className="project-chapter-list">
            {chapters.length ? chapters.map((chapter, chapterIndex) => {
              const isOpen = openChapter === chapter.id;
              const panelId = 'chapter-content-' + chapterIndex;
              return <article className={'project-chapter surface ' + (isOpen ? 'is-open' : '')} key={chapter.id ?? chapterIndex}>
                <h4 style={{ margin: 0 }}><button className="project-chapter-trigger" type="button" aria-expanded={isOpen} aria-controls={panelId} onClick={() => setOpenChapter(isOpen ? null : chapter.id)}>
                  <span className="project-chapter-number">{String(chapterIndex + 1).padStart(2, '0')}</span>
                  <span className="project-chapter-text"><span className="project-chapter-title">{chapter.title}</span><span className="project-chapter-meta">{numberFormat.format(Number(chapter.wordCount) || 0)} words · {chapterStatus(chapter.status)}</span></span>
                  <Icon name="ChevronDown" size={17} className="project-chapter-chevron" />
                </button></h4>
                {isOpen && <div className="project-chapter-content" id={panelId}>{chapter.content?.length ? chapter.content.map((paragraph, i) => <p key={i}>{paragraph}</p>) : <p className="project-chapter-empty">This chapter is ready for its first line.</p>}</div>}
              </article>;
            }) : <div className="project-empty surface"><div className="project-empty-icon"><Icon name="BookOpen" size={30} /></div><h2>Blank pages, endless possibility.</h2><p>Your chapter collection is waiting for its first draft.</p></div>}
          </div>
        </div>
      </section>;
    }
    function ProjectForm({ open, onClose, onSubmit, editingProject }) {
      const [form, setForm] = useState(initialForm);
      const [error, setError] = useState('');
      const [uploadName, setUploadName] = useState('');
      const fileRef = useRef(null);
      useEffect(() => {
        if (open) {
          setForm(editingProject ? { title: editingProject.title || '', genre: editingProject.genre || '', motifs: [...(editingProject.motifs || [])], description: editingProject.description || '', cover: editingProject.cover || '' } : { ...initialForm, motifs: [] });
          setError(''); setUploadName('');
        }
      }, [open, editingProject]);
      function toggleMotif(motif) { setForm(prev => ({ ...prev, motifs: prev.motifs.includes(motif) ? prev.motifs.filter(item => item !== motif) : [...prev.motifs, motif] })); }
      function onFileChange(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { setError('Choose an image file for the cover.'); return; }
        if (file.size > 3 * 1024 * 1024) { setError('Cover image must be smaller than 3 MB.'); return; }
        const reader = new FileReader();
        reader.onload = () => { setForm(prev => ({ ...prev, cover: `linear-gradient(180deg, rgba(13,23,46,.1), rgba(13,23,46,.24)), url("${reader.result}")` })); setUploadName(file.name); setError(''); };
        reader.onerror = () => setError('Could not read that image. Try another file.');
        reader.readAsDataURL(file);
      }
      function submit(event) {
        event.preventDefault();
        if (!form.title.trim()) { setError('Give your story a title before continuing.'); return; }
        if (!form.genre) { setError('Choose a genre for your story.'); return; }
        onSubmit({ ...form, title: form.title.trim(), description: form.description.trim() });
      }
      const motifs = [...new Set([...motifSuggestions, ...((editingProject?.motifs) || [])])];
      return <Dialog open={open} onClose={onClose} title={editingProject ? 'Edit story project' : 'Create a new story'} wide>
        <div className="project-dialog-body"><p className="project-form-intro">{editingProject ? 'Refine the details of your story. Your chapters will stay just where they are.' : 'Every great story begins somewhere. Give yours a name and a world to grow into.'}</p>
          <form className="project-form" onSubmit={submit}>
            <div className="project-form-group"><label className="project-form-label" htmlFor="project-title">Story title *</label><input className="field surface-soft" id="project-title" value={form.title} maxLength="80" placeholder="e.g. The Atlas of Lost Hours" onChange={e => { setForm({ ...form, title: e.target.value }); setError(''); }} autoFocus /></div>
            <div className="project-form-group"><label className="project-form-label" htmlFor="project-genre">Genre *</label><select className="field surface-soft" id="project-genre" value={form.genre} onChange={e => { setForm({ ...form, genre: e.target.value }); setError(''); }}><option value="">Choose a genre</option>{[...new Set([...allGenres, ...(editingProject?.genre ? [editingProject.genre] : [])])].map(genre => <option value={genre} key={genre}>{genre}</option>)}</select></div>
            <div className="project-form-group is-wide"><span className="project-form-label">Story motifs <span className="is-optional">· choose a few</span></span><div className="project-motif-options">{motifs.map(motif => <button className={'project-motif surface-soft ' + (form.motifs.includes(motif) ? 'is-selected' : '')} type="button" aria-pressed={form.motifs.includes(motif)} onClick={() => toggleMotif(motif)} key={motif}>{motif}</button>)}</div></div>
            <div className="project-form-group is-wide"><label className="project-form-label" htmlFor="project-description">Description <span className="is-optional">· optional</span></label><textarea className="field surface-soft" id="project-description" maxLength="500" value={form.description} placeholder="What happens when your story begins?" onChange={e => setForm({ ...form, description: e.target.value })} /></div>
            <div className="project-form-group is-wide"><span className="project-form-label">Cover artwork <span className="is-optional">· optional</span></span><input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={onFileChange} aria-label="Choose cover image" /><button type="button" className="project-upload surface-soft" onClick={() => fileRef.current?.click()}><span className="project-upload-icon surface"><Icon name="Upload" size={18} /></span><span><strong>{uploadName || 'Upload your own cover image'}</strong><small>{uploadName ? 'Ready to use · click to change' : 'PNG, JPG or WebP · up to 3 MB. Otherwise we’ll create an atmospheric cover.'}</small></span></button></div>
            {error && <p className="project-form-error" role="alert">{error}</p>}
            <div className="project-form-footer"><button type="button" className="btn surface-soft" onClick={onClose}>Cancel</button><button type="submit" className="btn btn-primary">{editingProject ? 'Save changes' : 'Create project'}</button></div>
          </form>
        </div>
      </Dialog>;
    }
    function App() {
      const [projects, setProjects] = useState(() => initialProjects.map(project => ({ ...project, motifs: [...(project.motifs || [])], chapters: [...(project.chapters || [])] })));
      const [query, setQuery] = useState('');
      const [genre, setGenre] = useState('All stories');
      const [selectedId, setSelectedId] = useState(() => projectIdFromHash(initialProjects));
      const [formOpen, setFormOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [deleteOpen, setDeleteOpen] = useState(false);
      const [toast, setToast] = useState('');
      useEffect(() => { if (!toast) return; const timer = setTimeout(() => setToast(''), 3500); return () => clearTimeout(timer); }, [toast]);
      useEffect(() => {
        const syncHash = () => setSelectedId(projectIdFromHash(projects));
        window.addEventListener('hashchange', syncHash);
        window.addEventListener('popstate', syncHash);
        return () => { window.removeEventListener('hashchange', syncHash); window.removeEventListener('popstate', syncHash); };
      }, [projects]);
      function openProject(id) {
        window.history.pushState(null, '', '#' + encodeURIComponent(id));
        setSelectedId(id);
      }
      function closeProject() {
        if (window.location.hash) window.history.pushState(null, '', window.location.pathname + window.location.search);
        setSelectedId(null);
      }
      const genreOptions = ['All stories', ...filterGenres];
      const filtered = useMemo(() => projects.filter(project => {
        const searchText = [project.title, project.genre, ...(project.motifs || [])].join(' ').toLowerCase();
        return matchesGenre(project.genre, genre) && searchText.includes(query.trim().toLowerCase());
      }), [projects, query, genre]);
      const selected = projects.find(project => project.id === selectedId);
      const editing = projects.find(project => project.id === editingId);
      const selectedIndex = selected ? projects.findIndex(project => project.id === selected.id) : -1;
      function openCreate() { setEditingId(null); setFormOpen(true); }
      function openEdit() { setEditingId(selectedId); setFormOpen(true); }
      function saveProject(form) {
        if (editingId != null) {
          setProjects(prev => prev.map(project => project.id === editingId ? { ...project, ...form, updatedAt: new Date().toISOString() } : project));
          setToast('Story details updated.');
        } else {
          const newProject = { ...form, id: 'local-' + Date.now(), cover: form.cover || fallbackCovers[projects.length % fallbackCovers.length], author: 'You', status: 'Draft', chapters: [], wordCount: 0, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
          setProjects(prev => [newProject, ...prev]);
          setGenre('All stories'); setQuery(''); openProject(newProject.id);
          setToast('Your new story is ready.');
        }
        setFormOpen(false); setEditingId(null);
      }
      function removeProject() {
        if (!selected) return;
        const title = selected.title;
        setProjects(prev => prev.filter(project => project.id !== selected.id));
        closeProject(); setDeleteOpen(false); setToast('“' + title + '” was removed from this local session.');
      }
      function exportProject() {
        if (!selected) return;
        const text = [selected.title, `${selected.genre || 'Story'} · ${selected.status || 'Draft'}`, selected.description || '', ...(selected.chapters || []).flatMap((chapter, i) => ['', `Chapter ${i + 1}: ${chapter.title}`, '', ...(chapter.content || [])])].join('\n\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = (selected.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'story') + '.txt';
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setToast('Manuscript exported as a text file.');
      }
      return <Shell active="projects">
        <main className="projects-page">
          <div className="page-topbar"><span className="page-breadcrumb">Workspace / <strong>Projects</strong></span><div className="page-topbar-actions"><button className="project-create-btn btn-primary" type="button" onClick={openCreate}><Icon name="Plus" size={17} /> New Project</button></div></div>
           <div className="projects-toolbar"><div className="project-library-title"><strong>THE COLLECTION</strong><span className="project-count">{projects.length}</span></div><div className="project-toolbar-side"><span className="project-sort-label"><Icon name="Layers" size={13} /> Curated stories</span><div className="project-search-wrap"><Icon name="Search" size={16} className="search-icon" /><input className="project-search field surface-soft" type="search" placeholder="Search stories or motifs..." aria-label="Search stories or motifs" value={query} onChange={e => setQuery(e.target.value)} /></div></div></div>
          <nav className="project-filters" aria-label="Filter projects by genre"><span className="project-filter-label"><Icon name="SlidersHorizontal" size={14} /> Genre</span>{genreOptions.map(option => <button type="button" className={'project-filter surface-soft ' + (genre === option ? 'is-selected' : '')} aria-pressed={genre === option} key={option} onClick={() => setGenre(option)}>{option}</button>)}</nav>
          <section className="project-grid" aria-label="Story projects">
            {filtered.length ? filtered.map((project) => <ProjectCard key={project.id} project={project} index={projects.findIndex(item => item.id === project.id)} onOpen={openProject} />) : <div className="project-empty surface"><div className="project-empty-icon"><Icon name="BookOpen" size={32} /></div><h2>{projects.length ? 'No stories in this chapter.' : 'Your library starts here.'}</h2><p>{projects.length ? 'Try another search or genre to find the story you’re looking for.' : 'Create a project to begin shaping your first story.'}</p><button type="button" onClick={projects.length ? () => { setQuery(''); setGenre('All stories'); } : openCreate}>{projects.length ? 'Clear filters' : 'Create a project'}</button></div>}
          </section>
          <footer className="projects-footnote"><span><Icon name="BookOpen" size={13} /> {filtered.length} {filtered.length === 1 ? 'story' : 'stories'} on this shelf</span><span>Made for the stories only you can tell.</span></footer>
          {selected && <ProjectDetail key={selected.id} project={selected} index={selectedIndex} blocked={formOpen || deleteOpen} onClose={closeProject} onEdit={openEdit} onDelete={() => setDeleteOpen(true)} onExport={exportProject} />}
          <ProjectForm open={formOpen} onClose={() => { setFormOpen(false); setEditingId(null); }} onSubmit={saveProject} editingProject={editing} />
          <Dialog open={deleteOpen} onClose={() => setDeleteOpen(false)} title="Delete this project?">
            <div className="project-dialog-body"><p className="project-confirm-copy">Are you sure you want to remove <strong>{selected?.title}</strong>? This removes it from your current local session. Export a copy first if you'd like to keep the manuscript.</p><div className="project-form-footer"><button className="btn surface-soft" type="button" onClick={() => setDeleteOpen(false)}>Keep project</button><button className="btn project-danger-btn" type="button" onClick={removeProject}>Delete project</button></div></div>
          </Dialog>
          {toast && <div className="project-toast" role="status"><Icon name="Check" size={16} />{toast}</div>}
        </main>
      </Shell>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

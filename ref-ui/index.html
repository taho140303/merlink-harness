<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlink Harness — Your creative workspace</title>
  <meta name="description" content="A quiet workspace for stories worth telling." />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="shared.css" />
  <script>try{const theme=localStorage.getItem('merlink-theme');if(theme==='dark'){document.documentElement.dataset.theme='dark';document.documentElement.classList.add('dark')}}catch(e){}</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Shell, Icon, ThemeToggle, mock } = Merlink;
    function Dashboard() {
      const topProjects = mock.projects.slice(0, 3);
      const totalWords = mock.projects.reduce((sum, project) => sum + project.wordCount, 0);
      const cards = [
        { icon: 'BookOpen', value: String(mock.projects.length).padStart(2, '0'), label: 'Stories in your library' },
        { icon: 'Users', value: String(mock.characters.length).padStart(2, '0'), label: 'Characters brought to life' },
        { icon: 'Feather', value: `${Math.round(totalWords / 1000)}k`, label: 'Words across your worlds' }
      ];
      const links = [
        { icon: 'MessageSquare', label: 'Write with AI', url: 'chat.html' },
        { icon: 'Users', label: 'Meet your characters', url: 'characters.html' },
        { icon: 'Settings2', label: 'Shape your writing style', url: 'story-config.html' },
        { icon: 'Bot', label: 'Connect an AI provider', url: 'ai-provider.html' }
      ];
      return <Shell active="home">
        <header className="dashboard-header">
          <div className="dashboard-heading"><p className="kicker">Your creative desk / Overview</p><h1 className="page-title">Good to have you back.</h1><p>Every great story starts with a moment to begin.</p></div>
          <div className="dashboard-header-tools"><span className="dashboard-date surface-soft">✦ &nbsp; Your writing space</span><ThemeToggle /></div>
        </header>
        <section className="dashboard-hero surface" aria-labelledby="hero-heading">
          <div className="dashboard-hero-copy">
            <span className="kicker">Pick up the thread</span>
            <h2 id="hero-heading">Make room for the <em>next chapter.</em></h2>
            <p>A place for your ideas to wander and your words to find their way. Your worlds are waiting right where you left them.</p>
            <div className="dashboard-hero-actions"><a className="btn btn-primary" href="chat.html"><Icon name="Sparkles" size={17} /> Start writing <Icon name="ArrowUpRight" size={15} /></a><a className="btn" href="projects.html"><Icon name="BookOpen" size={17} /> Browse stories</a></div>
          </div>
          <div className="dashboard-hero-art" aria-hidden="true"><div className="dashboard-art-frame"><div className="dashboard-art-moon"></div><div className="dashboard-art-horizon"></div><div className="dashboard-art-orbit"></div></div><div className="dashboard-art-caption"><Icon name="Feather" size={15} /> Words become worlds</div></div>
        </section>
        <section className="dashboard-metrics" aria-label="Your writing at a glance">
          {cards.map(item => <div className="metric surface" key={item.label}><div className="metric-icon"><Icon name={item.icon} size={20} /></div><div><div className="metric-value">{item.value}</div><div className="metric-label">{item.label}</div></div></div>)}
        </section>
        <div className="dashboard-lower">
          <section aria-labelledby="recent-heading"><div className="dashboard-section-head"><div><p className="kicker">Your library</p><h2 id="recent-heading" className="section-title">Recently in the works</h2></div><a className="dashboard-text-link" href="projects.html">All projects <Icon name="ArrowRight" size={14} /></a></div><div className="dashboard-projects">
            {topProjects.map(project => <a key={project.id} href={'projects.html#' + project.id} className="dashboard-project surface-interactive"><span className="dashboard-project-cover" style={{background:project.cover}} aria-hidden="true"></span><span className="dashboard-project-body"><strong>{project.title}</strong><p>{project.description}</p><span className="dashboard-project-meta"><span>{project.genre}</span><span>·</span><span>{project.chapters.length} chapters</span><span>·</span><span>{project.updatedAt}</span></span></span><Icon name="ArrowUpRight" size={17} className="dashboard-project-arrow" /></a>)}
          </div></section>
          <aside className="dashboard-rail"><section className="dashboard-quick surface" aria-labelledby="quick-heading"><p className="kicker">Go somewhere</p><h2 id="quick-heading" className="section-title">Your workspace</h2><div className="dashboard-quick-list">{links.map(link => <a key={link.url} className="dashboard-quick-link" href={link.url}><Icon name={link.icon} size={17} /><span>{link.label}</span><Icon name="ArrowUpRight" size={14} /></a>)}</div></section>
            <section className="dashboard-activity surface" aria-labelledby="activity-heading"><p className="kicker">The latest</p><h2 id="activity-heading" className="section-title">Recent activity</h2><div className="dashboard-activity-list"><div className="dashboard-activity-item"><span className="dashboard-activity-dot"></span><div><p><strong>The Glass Tide</strong> is ready for its next scene.</p><time>2 hours ago</time></div></div><div className="dashboard-activity-item"><span className="dashboard-activity-dot"></span><div><p>You explored a new idea in <strong>AI Chat</strong>.</p><time>Yesterday</time></div></div><div className="dashboard-activity-item"><span className="dashboard-activity-dot"></span><div><p><strong>The Midnight Orchard</strong> gained a chapter.</p><time>2 days ago</time></div></div></div></section>
          </aside>
        </div>
        <p className="dashboard-footnote">Merlink Harness · A little more room for imagination · Local preview</p>
      </Shell>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>

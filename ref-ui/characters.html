      .ch-intro h1 { font-size: clamp(39px, 8.9vw, 59px); }
      .ch-grid { gap: 15px; }
      .ch-card { min-height: 0; }
      .ch-card-body { padding: 14px; }
      .ch-card h2 { font-size: 21px; }
      .ch-stats span { font-size: 9px; }
      .ch-detail { grid-template-columns: 1fr; }
      .ch-detail .ch-portrait { min-height: 0; height: 270px; }
      .ch-detail-content { padding-top: 2px; }
    }
    @media (max-width: 570px) {
      .ch-controls { padding: 10px; gap: 8px; }
      .ch-search { flex-basis: 100%; }
      .ch-select-wrap { flex: 1 1 calc(50% - 4px); }
      .ch-select-wrap select { min-width: 0; max-width: none; width: 100%; }
      .ch-create { width: 100%; }
      .ch-grid { grid-template-columns: 1fr; max-width: 450px; margin: auto; }
      .ch-card { min-height: 0; max-height: none; }
      .ch-card-body { padding: 18px 20px; }
      .ch-card h2 { font-size: 26px; }
      .ch-collection-line { margin-top: 24px; }
      .ch-form-grid { grid-template-columns: 1fr; }
      .ch-form-field--full { grid-column: auto; }
      .ch-toast { right: 15px; left: 15px; bottom: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { .ch-card, .ch-toast { animation: none; } .ch-card, .ch-view, .ch-create { transition: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./shared.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const { Shell, Icon, ThemeToggle, Dialog } = window.Merlink;
    const PALETTES = [
      { art: 'linear-gradient(148deg,#a3b9b8 2%,#70899a 43%,#273b5a 100%)', cloak:'#25344a', skin:'#d4ab8c', shadow:'#9c796e', hair:'#252e38', hairLight:'#526275', tilt:'-9deg' },
      { art: 'linear-gradient(150deg,#d3a9ab 0%,#a36e83 45%,#474661 100%)', cloak:'#4b374a', skin:'#e5b597', shadow:'#a87773', hair:'#282737', hairLight:'#6a4b5b', tilt:'7deg' },
      { art: 'linear-gradient(145deg,#b2bfc5 0%,#778fa1 43%,#344f64 100%)', cloak:'#263a45', skin:'#be9376', shadow:'#78574f', hair:'#232e32', hairLight:'#566c73', tilt:'-4deg' },
      { art: 'linear-gradient(150deg,#d8bfad 0%,#a48684 45%,#665b73 100%)', cloak:'#533e4b', skin:'#dfb996', shadow:'#9a6f67', hair:'#342d31', hairLight:'#765c5b', tilt:'6deg' },
      { art: 'linear-gradient(145deg,#a8bad0 0%,#7c89ae 44%,#343d63 100%)', cloak:'#313455', skin:'#c4a28c', shadow:'#816b6d', hair:'#292a3d', hairLight:'#565678', tilt:'-7deg' },
      { art: 'linear-gradient(148deg,#c6ccc5 0%,#8ca9a6 43%,#476277 100%)', cloak:'#375363', skin:'#d1a88e', shadow:'#876c68', hair:'#25313a', hairLight:'#566b69', tilt:'9deg' },
      { art: 'linear-gradient(150deg,#d6b1bd 0%,#aa8ca6 42%,#5a5975 100%)', cloak:'#44394e', skin:'#e0b79e', shadow:'#987478', hair:'#333044', hairLight:'#6a566e', tilt:'-8deg' },
      { art: 'linear-gradient(148deg,#bec7bb 0%,#8c9b8c 45%,#4d686a 100%)', cloak:'#324545', skin:'#cba586', shadow:'#846b61', hair:'#283537', hairLight:'#586965', tilt:'8deg' },
      { art: 'linear-gradient(150deg,#bac4d5 0%,#858caf 45%,#495376 100%)', cloak:'#313b58', skin:'#d9ab94', shadow:'#956f75', hair:'#2c3045', hairLight:'#555b78', tilt:'-5deg' }
    ];
    const STORAGE_KEY = 'merlink-custom-characters';
    const PERSONALITY_TRAITS = ['Curious','Resilient','Guarded','Loyal','Ambitious','Compassionate','Witty','Secretive','Brave','Patient','Restless','Hopeful'];
    const EMPTY_FORM = { name:'', role:'Main', age:'', gender:'', story:'', tags:[], appearance:'', backstory:'', bio:'', uploadedImage:'' };
    const assetIsPhoto = (item) => Boolean(item.uploadedImage || /^data:image\//i.test(item.image || '') || /^(?:https?:|\.\/|assets\/)/i.test(item.image || ''));
    const projectName = (story, projects) => projects.find((project) => String(project.id) === String(story) || project.title === story)?.title || story || 'Unassigned story';
    function readCustomCharacters() {
      try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); return Array.isArray(saved) ? saved : []; }
      catch (_) { return []; }
    }
    function portraitStyle(item, index) {
      const p = PALETTES[index % PALETTES.length];
      const image = item.uploadedImage || item.image;
      return {
        background: image ? (assetIsPhoto(item) ? `url("${image}") center / cover` : image) : p.art,
        '--ch-default-art': p.art, '--ch-cloak': p.cloak, '--ch-skin': p.skin, '--ch-skin-shadow': p.shadow,
        '--ch-hair': p.hair, '--ch-hair-light': p.hairLight, '--ch-tilt': p.tilt
      };
    }
    function Portrait({ item, index, label }) {
      return <div className={'ch-portrait' + (assetIsPhoto(item) ? ' ch-portrait--uploaded' : '')} style={portraitStyle(item,index)} role="img" aria-label={`Illustrated portrait of ${item.name}`}>
        <span className="ch-art-halo" /><span className="ch-art-figure" /><span className="ch-art-neck" /><span className="ch-art-head" /><span className="ch-art-hair" />
        <span className="ch-portrait-mark">{label || 'Character file'}</span><span className="ch-portrait-num">{String(index+1).padStart(2,'0')} / ARCHIVE</span>
        <span className="ch-portrait-name">{item.name}</span><span className="ch-portrait-seal" aria-hidden="true"><Icon name="Sparkles" size={15} /></span>
      </div>;
    }
    function CharacterCard({ item, index, projects, onView }) {
      const tagList = Array.isArray(item.tags) ? item.tags : [];
      return <article className="ch-card surface" style={{'--ch-i':index}}>
        <Portrait item={item} index={index} />
        <div className="ch-card-body">
          <div className="ch-card-top"><span className="ch-role">{item.role || 'Character'}</span><span className="ch-age">{item.age ? `Age ${item.age}` : 'Age unknown'}</span></div>
          <h2 title={item.name}>{item.name}</h2>
          <p className="ch-story" title={projectName(item.story,projects)}><Icon name="BookOpen" size={12} />{projectName(item.story,projects)}</p>
          <div className="ch-tags">{tagList.slice(0,3).map((tag,i) => <span className="ch-tag pill" key={`${tag}-${i}`}>{tag}</span>)}</div>
          <div className="ch-bottom"><div className="ch-stats"><span title="Relationships"><Icon name="UsersRound" size={13}/>{item.relationships?.length || 0}</span><span title="Dialogue scenes"><Icon name="MessageCircle" size={13}/>{item.dialogueCount || 0} scenes</span></div>
            <button type="button" className="ch-view surface-interactive" onClick={() => onView(item)} aria-label={`View ${item.name}'s character profile`}>View <Icon name="ArrowUpRight" size={13}/></button>
          </div>
        </div>
      </article>;
    }
    function CharacterDetail({ item, index, projects }) {
      const relationships = Array.isArray(item.relationships) ? item.relationships : [];
      return <div className="ch-dialog-body ch-detail">
        <Portrait item={item} index={index} label="Character portrait" />
        <div className="ch-detail-content">
          <div className="ch-detail-overline"><span className="ch-smallcaps">The character archive</span><span className="ch-detail-index">PROFILE NO. {String(index+1).padStart(2,'0')}</span></div>
          <h2>{item.name}</h2><p className="ch-detail-sub">{item.role || 'Character'} · {projectName(item.story,projects)}</p>
          <div className="ch-detail-tags">{(item.tags || []).map((tag,i) => <span className="ch-tag pill" key={`${tag}-${i}`}>{tag}</span>)}</div>
          <hr className="ch-detail-rule" />
          <div className="ch-detail-facts"><div className="ch-detail-fact"><strong>{item.age || '—'}</strong><span>Age</span></div><div className="ch-detail-fact"><strong>{item.gender || '—'}</strong><span>Gender</span></div><div className="ch-detail-fact"><strong>{item.dialogueCount || 0}</strong><span>Dialogue scenes</span></div></div>
          <section className="ch-detail-block"><h3>At a glance</h3><p>{item.bio || item.appearance || 'This character is waiting for their story to unfold.'}</p></section>
          {item.appearance && <section className="ch-detail-block"><h3>Appearance</h3><p>{item.appearance}</p></section>}
          <section className="ch-detail-block"><h3>Backstory</h3><p>{item.backstory || 'Their past is still being written.'}</p></section>
          <section className="ch-detail-block"><h3>Connections · {relationships.length}</h3>{relationships.length ? <ul className="ch-relationship-list">{relationships.map((relationship,i) => <li key={i}><strong>{typeof relationship === 'string' ? relationship : relationship.name}</strong><span>{typeof relationship === 'string' ? 'Connection' : relationship.relation || 'Connection'}</span></li>)}</ul> : <p>No relationships mapped yet. Every great story begins with a connection.</p>}</section>
        </div>
      </div>;
    }
    function CharacterForm({ projects, onClose, onCreate }) {
      const [form,setForm] = useState(EMPTY_FORM);
      const [uploadError,setUploadError] = useState('');
      function field(name) { return {value:form[name], onChange:(event) => setForm(current => ({...current,[name]:event.target.value}))}; }
      function toggleTrait(trait) { setForm(current => ({...current,tags:current.tags.includes(trait) ? current.tags.filter(value => value !== trait) : [...current.tags,trait].slice(0,5)})); }
      function upload(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { setUploadError('Choose a JPG, PNG, or WebP image.'); return; }
        if (file.size > 1500000) { setUploadError('Choose an image smaller than 1.5 MB.'); return; }
        setUploadError('');
        const reader = new FileReader();
        reader.onload = () => setForm(current => ({...current,uploadedImage:String(reader.result)}));
        reader.readAsDataURL(file);
      }
      function submit(event) {
        event.preventDefault();
        if (!form.name.trim() || !form.role.trim()) return;
        const character = {
          id:`custom-${Date.now()}`, name:form.name.trim(), role:form.role.trim(), age:form.age.trim(), gender:form.gender,
          story:form.story || projects[0]?.id || '', tags:form.tags,
          appearance:form.appearance.trim(), bio:form.bio.trim() || form.appearance.trim() || `${form.name.trim()} is a ${form.role.trim().toLowerCase()} whose story is just beginning.`,
          backstory:form.backstory.trim(), relationships:[], dialogueCount:0, uploadedImage:form.uploadedImage
        };
        onCreate(character);
      }
      return <form className="ch-dialog-body ch-form" onSubmit={submit}>
        <p className="ch-form-note">Give someone a place in your world. You can start with a few details and let the rest emerge as you write.</p>
        <div className="ch-form-grid">
          <div className="ch-form-field"><label htmlFor="ch-name">Full name *</label><input id="ch-name" autoFocus required maxLength="65" placeholder="e.g. Mara Voss" {...field('name')} /></div>
          <div className="ch-form-field"><label htmlFor="ch-role">Role *</label><select id="ch-role" required {...field('role')}><option value="Main">Main character</option><option value="Supporting">Supporting character</option><option value="Antagonist">Antagonist</option></select></div>
          <div className="ch-form-field"><label htmlFor="ch-age">Age <span>optional</span></label><input id="ch-age" type="number" min="0" max="999" placeholder="28" {...field('age')} /></div>
          <div className="ch-form-field"><label htmlFor="ch-gender">Gender <span>optional</span></label><input id="ch-gender" maxLength="40" placeholder="e.g. Woman, nonbinary" {...field('gender')} /></div>
          <div className="ch-form-field ch-form-field--full"><label htmlFor="ch-story">Story</label><select id="ch-story" {...field('story')}><option value="">Select a story</option>{projects.map(project => <option key={project.id} value={project.id}>{project.title}</option>)}</select></div>
          <div className="ch-form-field ch-form-field--full"><label id="ch-traits-label">Personality traits <span>choose up to five</span></label><div className="ch-trait-options" role="group" aria-labelledby="ch-traits-label">{PERSONALITY_TRAITS.map(trait => <button key={trait} type="button" className="ch-trait-option pill" aria-pressed={form.tags.includes(trait)} onClick={()=>toggleTrait(trait)}>{trait}</button>)}</div></div>
          <div className="ch-form-field ch-form-field--full"><label htmlFor="ch-appearance">Appearance</label><textarea id="ch-appearance" maxLength="600" placeholder="The details that make them recognizable…" {...field('appearance')} /></div>
          <div className="ch-form-field ch-form-field--full"><label htmlFor="ch-backstory">Backstory</label><textarea id="ch-backstory" maxLength="1500" placeholder="What happened before the first page?" {...field('backstory')} /></div>
          <div className="ch-form-field ch-form-field--full"><label htmlFor="ch-upload">Portrait <span>optional, up to 1.5 MB</span></label><label className="ch-upload" htmlFor="ch-upload">{form.uploadedImage ? <img className="ch-upload-preview" src={form.uploadedImage} alt="Portrait preview" /> : <Icon name="ImagePlus" size={18}/>}<span>{form.uploadedImage ? 'Portrait ready · click to replace' : 'Upload a portrait, or use the illustrated silhouette'}</span><input id="ch-upload" type="file" accept="image/png,image/jpeg,image/webp" onChange={upload} /></label>{uploadError && <span role="alert" style={{fontSize:11,color:'#bb4353'}}>{uploadError}</span>}</div>
        </div>
        <div className="ch-form-actions"><button type="button" className="ch-cancel btn" onClick={onClose}>Cancel</button><button type="submit" className="ch-submit btn btn-primary">Create character</button></div>
      </form>;
    }
    function CharactersPage() {
      const projects = window.Merlink.mock?.projects || [];
      const baseCharacters = window.Merlink.mock?.characters || [];
      const [custom,setCustom] = useState(readCustomCharacters);
      const [search,setSearch] = useState('');
      const [story,setStory] = useState('all');
      const [genre,setGenre] = useState('all');
      const [selected,setSelected] = useState(null);
      const [creating,setCreating] = useState(false);
      const [toast,setToast] = useState('');
      const allCharacters = useMemo(() => [...baseCharacters,...custom], [baseCharacters,custom]);
      const genres = useMemo(() => [...new Set(projects.map(item=>item.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b)), [projects]);
      const visible = useMemo(() => allCharacters.filter(item => {
        const matchStory = story === 'all' || String(item.story) === story || projectName(item.story,projects) === story;
        const linkedProject = projects.find(project => String(project.id) === String(item.story) || project.title === item.story);
        const matchGenre = genre === 'all' || linkedProject?.genre === genre;
        const q = search.trim().toLowerCase();
        const matchSearch = !q || [item.name,item.role,projectName(item.story,projects),...(item.tags || [])].join(' ').toLowerCase().includes(q);
        return matchStory && matchGenre && matchSearch;
      }),[allCharacters,story,genre,search,projects]);
      useEffect(() => { if (!toast) return; const timer = setTimeout(()=>setToast(''),3500); return ()=>clearTimeout(timer); },[toast]);
      function create(item) {
        const next = [item,...custom]; setCustom(next);
        try { localStorage.setItem(STORAGE_KEY,JSON.stringify(next)); setToast(`${item.name} has joined your character archive.`); }
        catch (_) { setToast(`${item.name} was added for this session. Image storage is full.`); }
        setCreating(false); setStory('all'); setGenre('all'); setSearch('');
      }
      return <Shell active="characters"><main className="ch-page">
        <div className="page-topbar"><span className="page-breadcrumb">Workspace / <strong>Characters</strong></span><div className="page-topbar-actions"><button type="button" className="ch-create btn btn-primary" onClick={()=>setCreating(true)}><Icon name="Plus" size={16}/> New character</button></div></div>
         <section className="ch-controls" aria-label="Character filters">
          <div className="ch-search"><Icon name="Search" size={16}/><input aria-label="Search characters" type="search" placeholder="Search names, traits, or stories..." value={search} onChange={event=>setSearch(event.target.value)} /></div>
          <div className="ch-select-wrap"><select aria-label="Filter by story" value={story} onChange={event=>setStory(event.target.value)}><option value="all">All stories</option>{projects.map(project=><option key={project.id} value={String(project.id)}>{project.title}</option>)}</select><Icon name="ChevronDown" size={14}/></div>
          <div className="ch-select-wrap"><select aria-label="Filter by genre" value={genre} onChange={event=>setGenre(event.target.value)}><option value="all">All genres</option>{genres.map(value=><option key={value} value={value}>{value}</option>)}</select><Icon name="ChevronDown" size={14}/></div>
        </section>
        <div className="ch-collection-line"><span className="ch-smallcaps">The collection</span><span className="ch-rule"/><span>{visible.length} {visible.length === 1 ? 'character' : 'characters'} {visible.length !== allCharacters.length ? 'found' : 'on record'}</span></div>
        {visible.length ? <section className="ch-grid" aria-label="Character profiles">{visible.map(item => <CharacterCard key={item.id} item={item} index={allCharacters.indexOf(item)} projects={projects} onView={setSelected}/>)}</section> : <div className="ch-empty"><div className="ch-empty-icon"><Icon name="UsersRound" size={25}/></div><h2>No characters found</h2><p>{allCharacters.length ? 'Try another search or clear your filters to see your whole cast.' : 'Your archive is waiting for its first story. Create a character to begin.'}</p><button type="button" onClick={()=>{setSearch('');setStory('all');setGenre('all'); if (!allCharacters.length) setCreating(true);}}>{allCharacters.length ? 'Clear filters' : 'Create a character'}</button></div>}
        <Dialog open={Boolean(selected)} onClose={()=>setSelected(null)} title="Character profile" wide>{selected && <CharacterDetail item={selected} index={allCharacters.indexOf(selected)} projects={projects}/>}</Dialog>
        <Dialog open={creating} onClose={()=>setCreating(false)} title="Create a character" wide>{creating && <CharacterForm projects={projects} onClose={()=>setCreating(false)} onCreate={create}/>}</Dialog>
        {toast && <div className="ch-toast" role="status"><Icon name="CheckCircle2" size={18}/>{toast}</div>}
      </main></Shell>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<CharactersPage />);
  </script>
</body>
</html>
